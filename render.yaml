# render.yaml — Render Deployment Configuration
# ================================================
# This file tells Render how to build and run Vote Secure.
# Commit this file to the root of your GitHub repository.

services:
  - type: web
    name: vote-secure
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:create_app()
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: vote-secure-db
          property: connectionString

databases:
  - name: vote-secure-db
    databaseName: votesecure
    user: votesecure_user
    plan: free
