{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card mx-auto">
      <div class="auth-header text-center">
        <div class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></div>
        <h2>Sign In</h2>
        <p class="text-muted">Welcome back — your vote matters.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="username" name="username"
                   class="form-control" placeholder="your_username"
                   value="{{ username or '' }}" required autofocus/>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" name="password"
                   class="form-control" placeholder="••••••••" required/>
            <button class="btn btn-outline-secondary toggle-pw" type="button"
                    data-target="password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <hr class="my-4"/>
      <p class="text-center mb-0 text-muted">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="auth-link">Register here</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
