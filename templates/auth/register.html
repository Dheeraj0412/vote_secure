{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card mx-auto">
      <div class="auth-header text-center">
        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
        <h2>Create Account</h2>
        <p class="text-muted">Join the election — register to vote.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="username" name="username"
                   class="form-control" placeholder="choose_a_username"
                   value="{{ username or '' }}" required autofocus
                   minlength="3" maxlength="80"/>
          </div>
          <div class="form-text">Minimum 3 characters.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" name="email"
                   class="form-control" placeholder="you@example.com"
                   value="{{ email or '' }}" required/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" name="password"
                   class="form-control" placeholder="Min. 6 characters" required
                   minlength="6"/>
            <button class="btn btn-outline-secondary toggle-pw" type="button"
                    data-target="password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="confirm_password" name="confirm_password"
                   class="form-control" placeholder="Repeat password" required/>
            <button class="btn btn-outline-secondary toggle-pw" type="button"
                    data-target="confirm_password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="bi bi-person-check me-2"></i>Create Account
        </button>
      </form>

      <hr class="my-4"/>
      <p class="text-center mb-0 text-muted">
        Already registered?
        <a href="{{ url_for('auth.login') }}" class="auth-link">Sign in here</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
