{% extends "base.html" %}
{% block title %}{{ action }} Candidate{% endblock %}

{% block content %}
<div class="page-header admin-header">
  <div class="container">
    <h1 class="page-title">
      <i class="bi bi-person-{% if action == 'Add' %}plus{% else %}gear{% endif %} me-2"></i>
      {{ action }} Candidate
    </h1>
    <p class="page-sub mb-0">
      {% if action == 'Add' %}Add a new candidate to the election.
      {% else %}Update candidate details.{% endif %}
    </p>
  </div>
</div>

<div class="container py-4">
  <div class="form-card mx-auto">
    <form method="POST" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">
          <i class="bi bi-person me-1"></i>Full Name <span class="text-danger">*</span>
        </label>
        <input type="text" id="name" name="name" class="form-control form-control-lg"
               placeholder="Candidate's full name"
               value="{{ candidate.name if candidate else '' }}"
               required maxlength="120"/>
      </div>

      <div class="mb-3">
        <label class="form-label" for="party">
          <i class="bi bi-flag me-1"></i>Party / Group <span class="text-danger">*</span>
        </label>
        <input type="text" id="party" name="party" class="form-control form-control-lg"
               placeholder="e.g. Independent, Science Party…"
               value="{{ candidate.party if candidate else '' }}"
               required maxlength="120"/>
      </div>

      <div class="mb-4">
        <label class="form-label" for="description">
          <i class="bi bi-card-text me-1"></i>Description / Manifesto
        </label>
        <textarea id="description" name="description" class="form-control"
                  rows="4" placeholder="A short bio or election manifesto…"
                  maxlength="1000">{{ candidate.description if candidate else '' }}</textarea>
        <div class="form-text">Optional — max 1000 characters.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-5">
          <i class="bi bi-check-lg me-2"></i>{{ action }} Candidate
        </button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
          <i class="bi bi-x me-1"></i>Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
